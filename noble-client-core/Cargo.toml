[package]
name = "noble-client-core"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Shared Rust library for Noble client apps — transaction building, signing, coin selection"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
noble-core.workspace = true
noble-crypto.workspace = true
noble-codec.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
hex.workspace = true
bip39.workspace = true
bip32.workspace = true
