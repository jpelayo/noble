#
# NOBLE Protocol Node Configuration
# Copy this file to your data directory and adjust values as needed.

[node]
# Operational role: validator, observer, or light.
role = "observer"

# Legacy field (ignored). Chain identity is derived from genesis block in storage.

[network]
# Address to listen for incoming P2P connections.
listen_addr = "/ip4/0.0.0.0/tcp/8780"

# Seed nodes to connect to on startup (multiaddr or hostname).
seeds = ["/dns4/node.infinitecontext.com/tcp/8780"]

# Maximum number of connected peers.
max_peers = 50

# Ban score threshold — peers exceeding this score are disconnected and banned.
ban_threshold = 100

[storage]
# Directory where blockchain data (RocksDB) is stored.
data_dir = "data"

# RocksDB block cache size in megabytes.
cache_size_mb = 256

# Enable Zstd compression on the blocks column family.
compression = true

# Pruning mode: "archive" (full history), "moderate" (keep recent state),
# or "aggressive" (minimal storage, headers + recent blocks).
# pruning_mode = "archive"

# Number of recent blocks to retain when pruning (only for moderate/aggressive).
# keep_blocks = 100000

[consensus]
# Path to the validator's private key file (Ed25519 or secp256k1).
# Leave empty to run as a non-validating (observer) node.
validator_key_path = ""

# Path to the local validator list file (one public key per line).
validator_list_path = "validators.txt"

# Voting strategy for Round 1 (Reflection phase).
# Options: first_valid, fixed_validator, round_robin, subset_rotation,
#          random, weighted_reputation, weighted_probability, follow_majority, manual
voting_strategy = "weighted_probability"

# Voting strategy for Round 2 (Confirmation phase).
confirmation_strategy = "follow_majority"

# For fixed_validator strategy: hex pubkey of preferred validator.
# voting_preferred_validator = ""

# For subset_rotation strategy: comma-separated hex pubkeys.
# voting_subset = []

# Minimum validators required for consensus participation (default: 2).
# Prevents single-node "ultraforking" while allowing small chains (2+ validators).
# The plurality floor (ceil(N/3) votes required) scales safely for any count.
# Raise this for stricter safety on large production networks.
# min_peers_for_consensus = 2

[api]
# JSON-RPC HTTP-only server bind address.
rpc_addr = "127.0.0.1:8783"

# WebSocket-only server bind address.
# Separated from rpc_addr — WS subscriptions run on a dedicated port.
ws_addr = "127.0.0.1:8784"

# Maximum concurrent RPC connections.
max_connections = 100

# Rate limit: maximum requests per second per client IP.
rate_limit = 30

# Enable TOTP-based authentication for RPC methods.
# When enabled, clients must include `Authorization: Bearer <SHA-256 hex of TOTP code>`.
totp_enabled = false

# TOTP enforcement scope: "all" (every request), "write_only" (only mutations),
# or "none" (disabled). In "write_only" mode, read-only methods (get*, estimate*,
# lookup*, verify*, validate*) work without authentication.
totp_scope = "all"

# Path to the TOTP shared secret file (base32-encoded).
# If empty and totp_enabled is true, a secret is auto-generated on first startup.
totp_secret_file = ""

# Dashboard GUI HTTP server bind address.
gui_addr = "127.0.0.1:8785"

# Allowed remote IPs or CIDR blocks for RPC/GUI access.
# 127.0.0.1 is always allowed. Empty = localhost-only.
# When non-empty, RPC and GUI bind to 0.0.0.0 (all interfaces).
# Examples: ["192.168.1.0/24"] or ["10.0.0.5", "172.16.0.0/12"]
allowed_ips = []

# Enable TLS (HTTPS/WSS) on the RPC (8783), WS (8784), and GUI (8785) servers.
# A self-signed certificate is auto-generated on first start and saved to the
# data directory.  Required for Tauri client apps, which run in a secure context
# and cannot connect to plain HTTP/WS endpoints without TLS.
tls_enabled = true

# Extra Subject Alternative Names for the self-signed TLS certificate.
# Add your server's LAN/WAN IP or hostname so remote browsers trust the cert.
# Example: ["192.168.1.100", "node.example.com"]
tls_san = []

# EMERGENCY ONLY: When true, fall back to plain HTTP if TLS cert generation fails.
# Default false = refuse to start if TLS fails (fail-closed, recommended).
# WARNING: Enabling this means all API traffic is UNENCRYPTED if TLS fails.
# A loud warning banner is logged at startup when plaintext fallback is active.
# Only enable temporarily to diagnose cert issues; disable once resolved.
tls_allow_plaintext_fallback = false

# Allow remote browser access during first-boot setup mode (when identity.json is absent).
# Default false = localhost-only setup (secure default). The node binds to 127.0.0.1 so only
# local browsers can reach the setup wizard, preventing unauthorized remote configuration.
#
# Preferred approach: set allowed_ips (e.g. allowed_ips = ["192.168.1.0/24"]) — the node
# will automatically honour the whitelist during setup mode and bind to 0.0.0.0 with the
# same IP filter applied, without requiring remote_setup = true.
#
# Set remote_setup = true ONLY when you want to bypass the IP whitelist entirely and expose
# the setup wizard to all remote addresses (e.g. cloud node with a dynamic IP).
# remote_setup = false

[wallet]
# Directory where encrypted keystores are stored.
keystore_path = "keystore"

[logging]
# Log level: error, warn, info, debug, trace.
level = "info"

# Log file path. Empty string means stdout only.
file = ""

# Log file rotation: "daily", "hourly", or "never".
rotation = "daily"

[metrics]
# Prometheus metrics endpoint bind address.
prometheus_addr = "127.0.0.1:8787"

# Enable or disable metrics collection and the /metrics HTTP endpoint.
# Disabled by default — enable via CLI setup wizard or dashboard settings.
enabled = false

[trace]
# Maximum entries in the RAM ring buffer (no disk I/O).
buffer_capacity = 50000

# Initial filter directive. Override with NOBLE_LOG env var.
initial_filter = "info"

# Output traces to stderr in addition to the ring buffer.
# Enabled by default so startup failures are visible in systemd/journalctl.
# Set to false only if you want completely silent operation (all logs via getTraceLog RPC only).
stderr_enabled = true

[gateway]
# Enable gateway fee split. When enabled, outgoing transactions include the
# gateway address so this node earns 50% of the transaction fee.
enabled = true

# Path to a file containing the gateway public key (hex-encoded wire bytes).
# If empty, the first wallet key is used automatically.
# Set this to use a dedicated key for gateway operations.
key_path = ""

[rewards]
# Bitcoin address (bc1q..., 1..., bc1p...) or NOBLE public key (hex).
# Receives gateway fee splits. Block subsidy goes to the validator key.
# Leave empty to use the gateway key as the fee-split destination.
reward_address = ""

[security]
# At-rest encryption mode for private key files (validator key, P2P identity,
# TLS key, TOTP secret, PKI attestation).
#
# "automatic" — Machine-specific key. No password required on startup.
#               Files are encrypted with AES-256-GCM using a key derived from
#               an obfuscated hardcoded IKM + per-installation .chain_meta.
#               Provides casual-exposure reduction (prevents plaintext in backups/logs).
#
# "manual"   — Password-protected. Operator must enter a password on every startup.
#               The .chain_meta file is locked with Argon2id + AES-GCM using the
#               password. Stronger protection at the cost of manual intervention.
encryption_mode = "automatic"

[identity]
# Human-readable name for this node (max 64 chars).
node_name = ""

# Organization type. One of:
#   Individual, IndependentResearcher,
#   University, ResearchLab, NGO, Foundation, OpenSourceProject,
#   Cooperative, CommunityGroup, ReligiousOrganization,
#   Enterprise, Startup, InfrastructureProvider, FinancialInstitution,
#   GovernmentFederal, GovernmentRegional, GovernmentMunicipal,
#   MilitaryOrDefense, CentralBank,
#   Hospital, Museum, MediaOutlet
org_type = "Individual"

# Organization name (optional, max 128 chars).
org_name = ""

# Node role: FullNode, Validator, ArchiveNode, LightClient, Gateway
node_role = "FullNode"

# Whether this node wants to produce blocks (consensus participation).
wants_to_validate = false

# Whether this node wants to cast consensus votes.
wants_to_vote = false

# Contact email for the node operator (optional).
# WARNING: This email is broadcast publicly to all network peers via GossipSub.
contact_email = ""

# Organization website URL (optional).
website = ""

# Publicly reachable host address for this node (optional).
host_address = ""

# Path to a PKCS#12 (.p12/.pfx) file for one-time PKI identity binding.
# The private key signs a binding message: sha256("NOBLE-PKI-BIND-v1" || identity_key).
# After the first successful binding, the .p12 file can be removed — the attestation
# is saved to identity_attestation.cbor and loaded on subsequent startups.
pkcs12_path = ""

# Password for the PKCS#12 file. Only needed for the initial binding.
pkcs12_password = ""

# Directory containing trusted CA certificates (PEM/DER files) for verifying
# PKI attestations from other nodes. Each node maintains its own trust store,
# paralleling PoR's per-node validator list philosophy.
ca_store_path = ""
