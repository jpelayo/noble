#
# NOBLE Protocol Node Configuration
# Copy this file to your data directory and adjust values as needed.

[node]
# Operational role: validator, observer, or light.
role = "observer"

# Target network: mainnet, testnet, or regtest.
network = "mainnet"

[network]
# Address to listen for incoming P2P connections.
listen_addr = "/ip4/0.0.0.0/tcp/8780"

# Seed nodes to connect to on startup (multiaddr format).
seeds = []

# Maximum number of connected peers.
max_peers = 50

# Ban score threshold — peers exceeding this score are disconnected and banned.
ban_threshold = 100

[storage]
# Directory where blockchain data (RocksDB) is stored.
data_dir = "data"

# RocksDB block cache size in megabytes.
cache_size_mb = 256

# Enable Zstd compression on the blocks column family.
compression = true

[consensus]
# Path to the validator's private key file (Ed25519 or secp256k1).
# Leave empty to run as a non-validating (observer) node.
validator_key_path = ""

# Path to the local validator list file (one public key per line).
validator_list_path = "validators.txt"

# Voting strategy for Round 1 (Reflection phase).
# Options: first_valid, fixed_validator, round_robin, subset_rotation,
#          random, weighted_reputation, follow_majority, manual
voting_strategy = "first_valid"

# Voting strategy for Round 2 (Confirmation phase).
confirmation_strategy = "follow_majority"

# For fixed_validator strategy: hex pubkey of preferred validator.
# voting_preferred_validator = ""

# For subset_rotation strategy: comma-separated hex pubkeys.
# voting_subset = []

[api]
# JSON-RPC HTTP server bind address.
rpc_addr = "127.0.0.1:8783"

# WebSocket server bind address for subscriptions.
ws_addr = "127.0.0.1:8784"

# Maximum concurrent RPC connections.
max_connections = 100

# Rate limit: maximum requests per second per client IP.
rate_limit = 30

# Enable TOTP-based authentication for RPC methods.
# When enabled, clients must include `Authorization: Bearer <SHA-256 hex of TOTP code>`.
totp_enabled = false

# TOTP enforcement scope: "all" (every request), "write_only" (only mutations),
# or "none" (disabled). In "write_only" mode, read-only methods (get*, estimate*,
# lookup*, verify*, validate*) work without authentication.
totp_scope = "all"

# Path to the TOTP shared secret file (base32-encoded).
# If empty and totp_enabled is true, a secret is auto-generated on first startup.
totp_secret_file = ""

# Dashboard GUI HTTP server bind address.
gui_addr = "127.0.0.1:8785"

# Allowed remote IPs or CIDR blocks for RPC/GUI access.
# 127.0.0.1 is always allowed. Empty = localhost-only.
# When non-empty, RPC and GUI bind to 0.0.0.0 (all interfaces).
# Examples: ["192.168.1.0/24"] or ["10.0.0.5", "172.16.0.0/12"]
allowed_ips = []

[wallet]
# Directory where encrypted keystores are stored.
keystore_path = "keystore"

[logging]
# Log level: error, warn, info, debug, trace.
level = "info"

# Log file path. Empty string means stdout only.
file = ""

# Log file rotation: "daily", "hourly", or "never".
rotation = "daily"

[metrics]
# Prometheus metrics endpoint bind address.
prometheus_addr = "127.0.0.1:8786"

# Enable or disable metrics collection and the /metrics HTTP endpoint.
# Disabled by default — enable via CLI setup wizard or dashboard settings.
enabled = false

[trace]
# Maximum entries in the RAM ring buffer (no disk I/O).
buffer_capacity = 50000

# Initial filter directive. Override with NOBLE_LOG env var.
initial_filter = "info"

# Output traces to stderr in addition to the ring buffer (development only).
stderr_enabled = false

[gateway]
# Enable gateway fee split. When enabled, outgoing transactions include the
# gateway address so this node earns 50% of the transaction fee.
enabled = true

# Path to a file containing the gateway public key (hex-encoded wire bytes).
# If empty, the first wallet key is used automatically.
# Set this to use a dedicated key for gateway operations.
key_path = ""

[identity]
# Human-readable name for this node (max 64 chars).
node_name = ""

# Organization type. One of:
#   Individual, IndependentResearcher,
#   University, ResearchLab, NGO, Foundation, OpenSourceProject,
#   Cooperative, CommunityGroup, ReligiousOrganization,
#   Enterprise, Startup, InfrastructureProvider, FinancialInstitution,
#   GovernmentFederal, GovernmentRegional, GovernmentMunicipal,
#   MilitaryOrDefense, CentralBank,
#   Hospital, Museum, MediaOutlet
org_type = "Individual"

# Organization name (optional, max 128 chars).
org_name = ""

# Node role: FullNode, Validator, ArchiveNode, LightClient, Gateway
node_role = "FullNode"

# Whether this node wants to produce blocks (consensus participation).
wants_to_validate = false

# Whether this node wants to cast consensus votes.
wants_to_vote = false

# Contact email for the node operator (optional).
# WARNING: This email is broadcast publicly to all network peers via GossipSub.
contact_email = ""

# Organization website URL (optional).
website = ""

# Publicly reachable host address for this node (optional).
host_address = ""

# Path to a PKCS#12 (.p12/.pfx) file for one-time PKI identity binding.
# The private key signs a binding message: sha256("NOBLE-PKI-BIND-v1" || identity_key).
# After the first successful binding, the .p12 file can be removed — the attestation
# is saved to identity_attestation.cbor and loaded on subsequent startups.
pkcs12_path = ""

# Password for the PKCS#12 file. Only needed for the initial binding.
pkcs12_password = ""

# Directory containing trusted CA certificates (PEM/DER files) for verifying
# PKI attestations from other nodes. Each node maintains its own trust store,
# paralleling PoR's per-node validator list philosophy.
ca_store_path = ""
