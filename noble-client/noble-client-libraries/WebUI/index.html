<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="light dark">
    <title>Noble</title>
    <link rel="stylesheet" href="css/noble.css">
</head>
<body autocorrect="off" autocapitalize="off" spellcheck="false">
    <!-- Persistent navigation rail. Hidden by default; app.js reveals it only on
         WRY desktop shells (Linux/Windows), which have no native sidebar/tab bar.
         Mac/iOS keep it hidden and navigate via native chrome. -->
    <nav id="side-nav" hidden></nav>
    <div id="chain-bar" class="chain-bar" hidden></div>
    <main id="app-content"></main>
    <script type="module" src="js/bridge.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
