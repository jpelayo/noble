[package]
name = "noble-cms-core"
description = "CMS/PKCS#7 per-field metadata signing for NOBLE (single Rust implementation, C ABI)"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
path = "rust-src/lib.rs"

[dependencies]
# `pkcs8` feature enables SecretKey::from_pkcs8_der for PKCS#12 key import.
p256 = { workspace = true, features = ["pkcs8"] }
k256.workspace = true
sha2.workspace = true
sha1.workspace = true
cms.workspace = true
x509-cert.workspace = true
pkcs12.workspace = true
# PBES2 decryption for PKCS#12 (PBKDF2 + AES/3DES-CBC; sha1 PRF for older files).
pkcs8 = { version = "0.10", features = ["encryption", "3des", "sha1-insecure"] }
der.workspace = true
const-oid.workspace = true
spki.workspace = true
signature.workspace = true
ecdsa.workspace = true
hex.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
rand.workspace = true
