[package]
name = "noble-cms-core"
description = "CMS/PKCS#7 per-field metadata signing for NOBLE (single Rust implementation, C ABI)"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
path = "rust-src/lib.rs"

[dependencies]
p256.workspace = true
k256.workspace = true
sha2.workspace = true
sha1.workspace = true
cms.workspace = true
x509-cert.workspace = true
pkcs12.workspace = true
der.workspace = true
const-oid.workspace = true
spki.workspace = true
signature.workspace = true
ecdsa.workspace = true
hex.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
rand.workspace = true
