[workspace]
members = [
    "noble-codec",
    "noble-crypto",
    "noble-core",
    "noble-storage",
    "noble-mempool",
    "noble-consensus",
    "noble-network",
    "noble-api",
    "noble-wallet",
    "noble-node",
    "noble-test-utils",
    "noble-tool",
    "noble-faucet",
    "noble-wire",
    "noble-client/noble-client-libraries/noble-tx-core",
    "noble-client/noble-client-libraries/noble-cms-core",
    "noble-client/noble-client-libraries/noble-mcp",
]
resolver = "2"

[workspace.package]
version = "0.150.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["InfiniteContext.com <blockchain@infinitecontext.com>"]
repository = "https://github.com/InfiniteContext/NOBLEv1"

[workspace.dependencies]
# Internal crates (path dependencies)
noble-codec = { path = "noble-codec" }
noble-crypto = { path = "noble-crypto" }
noble-core = { path = "noble-core" }
noble-storage = { path = "noble-storage" }
noble-mempool = { path = "noble-mempool" }
noble-consensus = { path = "noble-consensus" }
noble-network = { path = "noble-network" }
noble-api = { path = "noble-api" }
noble-wallet = { path = "noble-wallet" }
noble-test-utils = { path = "noble-test-utils" }
noble-tx-core = { path = "noble-client/noble-client-libraries/noble-tx-core" }

# External dependencies (added as implementation progresses)
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
thiserror = "2"
hex = "0.4"
rand = "0.8"
proptest = "1"
rocksdb = "0.22"
libp2p = { version = "0.54", features = [
    "tcp", "noise", "yamux", "gossipsub", "request-response",
    "identify", "ping", "macros", "tokio", "cbor", "kad"
] }
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
totp-rs = { version = "5", features = ["gen_secret"] }
tower = { version = "0.4", features = ["util"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
hkdf = "0.12"
subtle = "2"
openssl = { version = "0.10", features = ["vendored"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
hyper = { version = "1", features = ["full"] }
ipnet = "2"
bip39 = { version = "2", features = ["rand"] }
bip32 = "0.5"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = { version = "0.11", features = ["password"] }
sysinfo = "0.32"
dirs = "6"
parking_lot = "0.12"

prometheus = { version = "0.13", features = ["process"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rcgen = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
time = { version = "0.3", features = ["formatting"] }
pem = "3"
if-addrs = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
ureq = { version = "2", features = ["tls"] }
libc = "0.2"

# CMS/PKCS#7 per-field signing (RustCrypto ecosystem, all k256-0.13/der-0.7 generation)
p256 = { version = "0.13", features = ["ecdsa"] }
cms = { version = "0.2", features = ["builder"] }
x509-cert = "0.2"
pkcs12 = "0.1"
der = { version = "0.7", features = ["alloc", "oid"] }
const-oid = "0.9"
spki = "0.7"
signature = "2"
ecdsa = { version = "0.16", features = ["hazmat"] }
sha1 = "0.10"
