# Noble node — Docker compose.
#
# Bring up:     docker compose up -d --build
# Logs:         docker compose logs -f noble
# Reset chain:  docker compose run --rm noble reset-chain   (preserves keys)
# Verify codec: docker compose run --rm noble verify
# Shell:        docker compose run --rm noble shell
#
# All env vars are optional. Set them inline on the `docker compose up`
# command line — there is no .env file in this layout.
#
# Default layout mirrors the Homebrew install: noble serves self-signed TLS
# directly, with an app-level CIDR allowlist (NOBLE_ALLOWED_IPS). Operator
# opens https://<server-ip>:8785.
#
# Examples:
#   NOBLE_ALLOWED_IPS=192.168.0.0/16  docker compose up -d --build  # home LAN
#   NOBLE_ALLOWED_IPS=100.64.0.0/10   docker compose up -d --build  # Tailscale
#   NOBLE_ALLOWED_IPS=10.0.0.0/8      docker compose up -d --build  # corp LAN
#   docker compose up -d --build                                    # localhost only
#
# For nginx-proxy-manager fronting (TLS off, attach to `proxy` net), use
# docker-compose.override.yml — see docker/README.md.

# Pin the compose project name so containers carry the label
# `com.docker.compose.project=noble`. Without this the project name defaults
# to the directory name ("docker"), which collides with any other stack on
# the host whose folder is also called "docker" — Compose then prints the
# whole world as "orphan containers", and Portainer mis-groups the stacks.
name: noble

services:
  noble:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: noble:latest
    container_name: noble
    restart: unless-stopped
    environment:
      NOBLE_DATA_DIR: /var/lib/noble
      NOBLE_ROLE: ${NOBLE_ROLE:-observer}
      NOBLE_NODE_NAME: ${NOBLE_NODE_NAME:-noble-docker}
      NOBLE_ORG_TYPE: ${NOBLE_ORG_TYPE:-Individual}
      NOBLE_ORG_NAME: ${NOBLE_ORG_NAME:-}
      NOBLE_CONTACT_EMAIL: ${NOBLE_CONTACT_EMAIL:-}
      NOBLE_WEBSITE: ${NOBLE_WEBSITE:-}
      NOBLE_WANTS_TO_VALIDATE: ${NOBLE_WANTS_TO_VALIDATE:-false}
      NOBLE_WANTS_TO_VOTE: ${NOBLE_WANTS_TO_VOTE:-false}
      NOBLE_SEED_PEERS_TOML: ${NOBLE_SEED_PEERS_TOML:-}
      NOBLE_MAX_PEERS: ${NOBLE_MAX_PEERS:-32}
      NOBLE_REWARD_ADDRESS: ${NOBLE_REWARD_ADDRESS:-}
      NOBLE_PRUNING_MODE: ${NOBLE_PRUNING_MODE:-archive}
      NOBLE_KEEP_BLOCKS: ${NOBLE_KEEP_BLOCKS:-0}
      NOBLE_CACHE_MB: ${NOBLE_CACHE_MB:-256}
      NOBLE_COMPRESSION: ${NOBLE_COMPRESSION:-true}
      NOBLE_VOTING_STRATEGY: ${NOBLE_VOTING_STRATEGY:-weighted_probability}
      NOBLE_MIN_FEE_RATE: ${NOBLE_MIN_FEE_RATE:-1}
      NOBLE_TLS_ENABLED: ${NOBLE_TLS_ENABLED:-true}
      NOBLE_TOTP_ENABLED: ${NOBLE_TOTP_ENABLED:-false}
      NOBLE_ENCRYPTION_MODE: ${NOBLE_ENCRYPTION_MODE:-automatic}
      NOBLE_FAUCET_DISCOVERY: ${NOBLE_FAUCET_DISCOVERY:-true}
      NOBLE_FAUCET_SERVER: ${NOBLE_FAUCET_SERVER:-false}
      # CSV of CIDRs allowed to reach the RPC/WS/GUI/faucet ports. Empty →
      # 127.0.0.1/32 only (localhost-only, equivalent to brew --localonly).
      NOBLE_ALLOWED_IPS: ${NOBLE_ALLOWED_IPS:-}
      # Multi-path storage sharding (Phase 7). CSV of additional
      # directories the node uses as RocksDB tiers. Each must be a
      # separate bind-mount under `volumes:` below.
      NOBLE_EXTRA_DATA_DIRS: ${NOBLE_EXTRA_DATA_DIRS:-}
      # Reconciliation behaviour on startup: auto (default) | verify | off.
      NOBLE_RECONCILE_MODE: ${NOBLE_RECONCILE_MODE:-auto}
    # Host networking — the container shares the host's network stack and
    # binds 8780/8783/8784/8785/8786 directly on the host's interfaces.
    #
    # WHY NOT published `ports:`? On a host running Tailscale, a published
    # port goes through Docker's DNAT, which turns inbound tailnet traffic
    # into *forwarded* traffic. Tailscale's `ts-postrouting` MASQUERADE then
    # rewrites the source to the docker bridge gateway (172.x), so the node
    # sees every client as 172.x and the NOBLE_ALLOWED_IPS CIDR filter never
    # matches the real 100.x tailnet address. (Triggered whenever tailscaled
    # restarts/auto-updates — see tailscale/tailscale#10205.) Host networking
    # bypasses DNAT entirely: the node sees the real client IP, so the
    # allowlist works and survives Tailscale restarts.
    #
    # Linux-only (fine for server deploys). On macOS/Windows Docker Desktop,
    # revert to a `ports:` block.
    network_mode: host
    # Data lives in a HOST bind-mount at /opt/noble (override with
    # NOBLE_HOST_DATA_DIR=/some/other/path). Docker auto-creates the host
    # directory on first `up`, and the entrypoint chowns it to UID 10000
    # before dropping privileges — no manual prep on the host.
    #
    # Survives `docker compose down -v`, container rebuilds, and repo
    # re-clones. Anything short of a host disk failure.
    #
    # Daily key backup (recommended — chain resyncs from peers, keys do not):
    #   sudo crontab -e
    #     15 3 * * * tar czf /var/backups/noble-keys-$(date +\%Y\%m\%d).tar.gz \
    #       -C /opt/noble keystore.noble .chain_meta identity.json 2>/dev/null \
    #       && find /var/backups -name 'noble-keys-*.tar.gz' -mtime +30 -delete
    volumes:
      - ${NOBLE_HOST_DATA_DIR:-/opt/noble}:/var/lib/noble
